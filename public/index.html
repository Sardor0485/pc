const total=tot(),paid=Math.max(0,Math.min(r2(+$("#o_pd").value||0),total)),cid=$("#o_c").value,o={id:uid(),cid,pid:p.id,qty:n,price:pr,cost:p.cost,total,paid,st:0,at:Date.now()};p.qty-=n;DB.orders.push(o);if(paid>0)DB.payments.push({id:uid(),at:o.at,cid,oid:o.id,amt:paid});save();closeM();toast("Zakaz qabul qilindi, sklad yangilandi");render()}}
const readyTxt=o=>{const c=DB.clients.find(x=>x.id===o.cid),p=DB.products.find(x=>x.id===o.pid);return `Assalomu alaykum, ${c.name}! Zakazingiz (${p?p.model+" "+p.color:""} × ${o.qty}) TAYYOR. Olib ketishingiz mumkin. — Umarov Tarozi`};

function an(a){const f=from(),s=sts(f,1/0),P=per?sts(f-per*D,f):null,now=Date.now(),pm={},cm={},mo={},ec={};
s.os.forEach(o=>{const p=DB.products.find(x=>x.id===o.pid),k=p?p.model+" · "+p.color:"(o‘chirilgan)",g=pm[k]=pm[k]||{k,q:0,r:0,g:0},c=cm[o.cid]=cm[o.cid]||{k:cname(o.cid),n:0,r:0,it:{}};g.q+=o.qty;g.r+=o.total;g.g+=o.total-o.cost*o.qty;c.n++;c.r+=o.total;c.it[k]=(c.it[k]||0)+o.qty});
DB.expenses.filter(e=>e.at>=f).forEach(e=>ec[e.cat]=(ec[e.cat]||0)+e.amt);
const key=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")},M=k=>mo[k]=mo[k]||{s:0,g:0,e:0};
DB.orders.forEach(o=>{if(o.st!==3){const m=M(key(o.at));m.s+=o.total;m.g+=o.total-o.cost*o.qty}});DB.expenses.forEach(e=>M(key(e.at)).e+=e.amt);
const pl=Object.values(pm).sort((x,y)=>y.g-x.g),cl=Object.values(cm).sort((x,y)=>y.r-x.r).slice(0,6),last={};
DB.orders.forEach(o=>{if(o.st!==3)last[o.pid]=Math.max(last[o.pid]||0,o.at)});
const slow=DB.products.filter(p=>p.qty>0&&(last[p.id]||0)<now-30*D).sort((x,y)=>y.qty*y.cost-x.qty*x.cost).slice(0,6),rv=recv();
const dl=(c,p,inv)=>p?`<span class="${(c>=p)!==!!inv?"up":"dn"}">${c>=p?"↑":"↓"} ${Math.abs(Math.round((c-p)/Math.abs(p)*100))}%</span>`:"";
const cmp=P?`<div class="c" style="margin-bottom:12px"><h3>Oldingi davr bilan taqqoslash</h3><div class="tw"><table><tr><th></th><th>Hozir</th><th>Oldin</th><th></th></tr>${[["Savdo","sales"],["Yalpi foyda","gp"],["Xarajat","ex",1],["Sof foyda","net"],["Zakazlar soni","n",0,1]].map(r=>`<tr><td>${r[0]}</td><td>${r[3]?s[r[1]]:usd(s[r[1]])}</td><td class="mu">${r[3]?P[r[1]]:usd(P[r[1]])}</td><td>${dl(s[r[1]],P[r[1]],r[2])}</td></tr>`).join("")}</table></div><p class="mu" style="margin:10px 0 0">Savdo ${s.sales>=P.sales?"oshdi":"kamaydi"}: zakazlar ${P.n} → ${s.n}, o‘rtacha chek ${usd(P.n?P.sales/P.n:0)} → ${usd(s.n?s.sales/s.n:0)}, marja ${pc(P.gp,P.sales)} → ${pc(s.gp,s.sales)}.</p></div>`:"";
a.innerHTML=seg()+cmp+`<div class="g2"><div class="c"><h3>Eng foydali tovarlar</h3><div class="tw"><table><tr><th>Tovar</th><th>Soni</th><th>Savdo</th><th>Foyda</th><th>Marja</th></tr>${pl.slice(0,8).map(x=>`<tr><td>${esc(x.k)}</td><td>${fm(x.q)}</td><td>${usd(x.r)}</td><td class="${x.g<0?"er":"ok"}">${usd(x.g)}</td><td>${pc(x.g,x.r)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Savdo yo‘q</td></tr>'}</table></div>${pl.length>1?`<p class="mu" style="margin:10px 0 0">Eng kam sotilgan: ${esc(pl.slice().sort((x,y)=>x.q-y.q)[0].k)} (${fm(pl.slice().sort((x,y)=>x.q-y.q)[0].q)} ta)</p>`:""}</div>
<div class="c"><h3>Eng yaxshi mijozlar</h3>${cl.map(x=>`<div class="br"><div class="t"><b>${esc(x.k)}</b><b>${usd(x.r)}</b></div><div class="mu">${x.n} zakaz · ${Object.entries(x.it).sort((p,q)=>q[1]-p[1]).slice(0,3).map(e=>esc(e[0])+" × "+fm(e[1])).join(", ")}</div></div>`).join("")||'<div class="empty">Ma’lumot yo‘q</div>'}</div></div>
<div class="g2"><div class="c"><h3>Nasiya yoshi</h3>${bars([["0–30 kun",rv.b[0]],["31–60 kun",rv.b[1]],["60+ kun",rv.b[2]]],x=>x[1],x=>x[0],x=>"",rv.b[2]>0?"er":"")}</div>
<div class="c"><h3>Qotib qolgan tovar (30 kun sotilmagan)</h3>${bars(slow,p=>p.qty*p.cost,p=>esc(p.model+" · "+p.color),p=>fm(p.qty)+" ta · pul shu yerda band")}</div></div>
<div class="g2"><div class="c"><h3>Oylar bo‘yicha</h3><div class="tw"><table><tr><th>Oy</th><th>Savdo</th><th>Yalpi</th><th>Xarajat</th><th>Sof</th></tr>${Object.keys(mo).sort().reverse().slice(0,6).map(k=>{const m=mo[k],n=m.g-m.e;return `<tr><td>${k}</td><td>${usd(m.s)}</td><td>${usd(m.g)}</td><td>${usd(m.e)}</td><td class="${n<0?"er":"ok"}">${usd(n)}</td></tr>`}).join("")||'<tr><td colspan="5" class="empty">Ma’lumot yo‘q</td></tr>'}</table></div></div>
<div class="c"><h3>Xarajatlar (davr bo‘yicha)</h3>${bars(Object.entries(ec).sort((x,y)=>y[1]-x[1]),x=>x[1],x=>esc(x[0]),x=>pc(x[1],s.ex)+" ulushi")}</div></div>`}
